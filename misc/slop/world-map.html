<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>What does AI think the world looks like?</title>
    <meta
      name="description"
      content="Asking your on-device LLM what is at each coordinate on Earth"
    />
    <meta name="theme-color" content="#4fa1a7" />

    <link rel="stylesheet" type="text/css" href="/sheep3.css" />
    <link rel="stylesheet" type="text/css" href="/reform/v1/index.css" />
    <link rel="stylesheet" type="text/css" href="./setup.css" />
    <script src="/sheep3.js" charset="utf-8"></script>

    <style>
      #output {
        /* world-map.svg is centered at 10E i think which is probably better,
        but it makes the math harder (my head hurt) */
        background-image: url('./world-map-robinson-0e.jpg');
        background-size: contain;
        background-position: center;
        background-repeat: no-repeat;
      }
    </style>
  </head>
  <body>
    <form class="main" role="main" action="javascript:">
      <h1>Slop world map</h1>
      <p>
        Inspired by
        <a
          class="link"
          href="https://twitter.com/celestepoasts/status/2103232383139057950"
          >this xeet</a
        >. Uses the
        <a href="https://developer.chrome.com/docs/ai/prompt-api" class="link"
          >Google Chrome slop API</a
        >
        to ask an on-device LLM what is at each coordinate in the world. World
        map from
        <a
          href="https://commons.wikimedia.org/wiki/File:Robinson_projection_SW.jpg"
          class="link"
          >Wikimedia Commons</a
        >.
      </p>

      <div id="setup-status"></div>

      <div class="col-io reform:io">
        <div class="output-controls">
          <a class="file download">
            <span class="icon icon-download"></span>
            <span class="file-label">Download</span>
            <span class="file-name">No file available</span>
          </a>
          <button
            type="button"
            class="icon icon-copy"
            aria-label="Copy"
          ></button>
          <button
            type="button"
            class="icon icon-share"
            aria-label="Share"
          ></button>
        </div>
        <div class="image-content output-content">
          <canvas id="output" data-deps="rows colorSet"></canvas>
        </div>
      </div>

      <label class="field-label">
        <span class="label-primary">Rows</span>
        <input type="number" name="rows" min="1" value="10" />
      </label>

      <fieldset class="radio-set">
        <legend class="label-primary">Color set</legend>
        <label class="radio-label">
          <input
            type="radio"
            name="colorSet"
            value="binary"
            class="hidden-accessible"
            checked
          />
          <span class="radio-button"></span>
          <span class="label-secondary">Land (white) and water (black)</span>
        </label>
        <label class="radio-label">
          <input
            type="radio"
            name="colorSet"
            value="details"
            class="hidden-accessible"
          />
          <span class="radio-button"></span>
          <span class="label-secondary">Land details (sand and ice)</span>
        </label>
      </fieldset>
    </form>

    <script type="module">
      import { on, Out } from '/reform/v1/index.js'
      import { setup, parsePartialJson } from './setup.js'
      import { geoRobinson } from 'https://cdn.jsdelivr.net/npm/d3-geo-projection@4.0.0/+esm'
      import { Semaphore } from '../semaphore.js'

      // https://d3js.org/d3-geo/projection [long E/W, lat N/S] (in degrees) to
      // [x, y] or null (unclear what the range is)
      const projection = geoRobinson().scale(1).translate([0, 0])
      // negative is west and south
      const top = projection([0, 90])[1]
      const bottom = projection([0, -90])[1]
      // appears to be [0~960, 500~0] by default but is overridden rather than
      // compounded by scale/translate. with scale=1 it's [-pi~pi, close to
      // pi/2~-pi/2 but a bit more than half]
      // const projection = geoRobinson()
      //   .scale(2 / (bottom - top))
      //   .translate([0, 0])
      // y should now be +/- 1
      // console.log(projection([-180, 0]))
      // console.log(projection([0, 90]))
      const scaleX = projection([180, 0])[0]
      // slightly less than 1 for whatever reason
      const scaleY = projection([0, -90])[1]
      // console.log(projection.invert([scaleX, 1]))
      const insetX = projection([180, -90])[0]

      const session = await setup({
        expectedInputs: [{ type: 'text' }],
        expectedOutputs: [{ type: 'text' }],
        initialPrompts: [
          {
            role: 'system',
            content:
              "You're plotting a world map of Earth. What's at the given coordinates?"
          }
        ]
      })

      const PX_SIZE = 20

      const colors = {
        binary: { land: 'white', water: 'black' },
        details: { water: 'blue', ice: 'white', sand: 'yellow', land: 'green' }
      }

      // Copied from misc/chunks.html
      function shuffleInPlace (arr) {
        for (let i = arr.length - 1; i >= 1; i--) {
          const index = (Math.random() * (i + 1)) | 0
          if (index !== i) {
            ;[arr[i], arr[index]] = [arr[index], arr[i]]
          }
        }
      }

      function roundBasedOnMinmax (n, min, max) {
        // TODO
        return n.toFixed(1)
      }

      let _abort
      on('output', async (c, { rows, colorSet }) => {
        _abort?.abort()
        const abort = new AbortController()
        _abort = abort
        const cols = Math.ceil(rows * (scaleX / scaleY))
        c.canvas.width = cols * PX_SIZE
        c.canvas.height = rows * PX_SIZE
        c.scale(PX_SIZE, PX_SIZE)

        const jobs = []
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const y = (((row + 0.5) / rows) * 2 - 1) * scaleY
            const x = (((col + 0.5) / cols) * 2 - 1) * scaleX
            let coord = projection.invert([x, y])
            let minLong = projection.invert([
              ((col / cols) * 2 - 1) * scaleX,
              y
            ])[0]
            let maxLong = projection.invert([
              (((col + 1) / cols) * 2 - 1) * scaleX,
              y
            ])[0]
            if (x > insetX && coord[0] < 0) {
              // Projection wrapped around the globe; if the left edge is in
              // the globe then use 180 degrees
              if (minLong > 0) {
                coord[0] = 180
              } else {
                continue
              }
            } else if (x < -insetX && coord[0] > 0) {
              if (maxLong < 0) {
                coord[0] = -180
              } else {
                continue
              }
            }
            if (coord[0] < 0 && minLong > 0) {
              minLong = -180
            } else if (coord[0] > 0 && maxLong < 0) {
              maxLong = 180
            }
            const maxLat = projection.invert([
              x,
              ((row / rows) * 2 - 1) * scaleY
            ])[1]
            const minLat = projection.invert([
              x,
              (((row + 1) / rows) * 2 - 1) * scaleY
            ])[1]
            const lat = roundBasedOnMinmax(coord[1], minLat, maxLat)
            const long = roundBasedOnMinmax(coord[0], minLong, maxLong)
            c.fillStyle = `rgba(${((+long + 180) / 360) * 255}, ${((+lat + 90) / 180) * 255}, 255, 0.3)`
            c.fillRect(col, row, 1, 1)
            jobs.push({ x: col, y: row, lat, long })
          }
        }
        // console.log([...jobs])
        // shuffleInPlace(jobs)

        const semaphore = new Semaphore(4)
        await Promise.all(
          jobs.map(async ({ x, y, lat, long }) => {
            using _lock = await semaphore.acquire()
            abort.signal.throwIfAborted()
            const clone = await session.clone({ signal: abort.signal })
            abort.signal.throwIfAborted()
            const displayCoord = `${lat.replace('-', '')}°${+lat > 0 ? 'N' : 'S'} ${long.replace('-', '')}°${+long > 0 ? 'E' : 'W'}`
            console.log(displayCoord)
            const response = await clone.prompt(displayCoord, {
              responseConstraint: {
                type: 'string',
                enum: Object.keys(colors[colorSet])
              },
              signal: abort.signal
            })
            abort.signal.throwIfAborted()
            c.fillStyle = colors[colorSet][response.replaceAll('"', '')]
            c.fillRect(x, y, 1, 1)
          })
        ).catch(
          error =>
            !(error instanceof DOMException && error.name === 'AbortError') &&
            Promise.reject(error)
        )
        return Out.from('slop-world.png', c)
      })
    </script>
  </body>
</html>
