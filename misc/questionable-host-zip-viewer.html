<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Questionable host zip viewer</title>
    <meta
      name="description"
      content="Efficient file viewer for zip files uploaded via questionable host"
    />

    <link rel="stylesheet" type="text/css" href="/sheep3.css" />
    <script src="/sheep3.js" charset="utf-8"></script>
    <script src="https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.8.34/dist/zip.min.js"></script>

    <style>
      html,
      body {
        height: 100%;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        display: flex;
        box-sizing: border-box;
      }
      * {
        margin: 0;
        padding: 0;
      }
      button,
      input {
        border: none;
        background: none;
        color: inherit;
        font: inherit;
      }
      button:not(:disabled) {
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
        }
      }
      .no-hash {
        padding: 20px;
      }
      form {
        max-width: 500px;
        margin: auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
        padding: 20px;
        background-color: color-mix(in srgb, CanvasText 3%, transparent);
        border-radius: 15px;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      input {
        border: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
        background-color: color-mix(in srgb, CanvasText 5%, transparent);
        padding: 0 10px;
        width: 100%;
        box-sizing: border-box;
        &:focus {
          border-color: CanvasText;
          outline: 2px solid CanvasText;
        }
      }
      code,
      input {
        font-family: 'Consolas', monospace;
      }
      form button {
        background-color: color-mix(in srgb, CanvasText 7%, transparent);
        &:hover {
          background-color: color-mix(in srgb, CanvasText 15%, transparent);
        }
      }
      input,
      form button {
        border-radius: 10px;
        height: 40px;
      }
      code {
        background-color: color-mix(in srgb, CanvasText 10%, transparent);
        border-radius: 5px;
        padding: 2px 5px;
      }
      form a {
        text-decoration-color: color-mix(
          in srgb,
          currentColor 50%,
          transparent
        );
        &:hover {
          text-decoration-color: currentColor;
        }
      }
      .has-hash form {
        display: none;
      }
      #progress {
        height: 20px;
        border-radius: 5px;
        display: flex;
        gap: 1px;
        overflow: hidden;
        --progress: 0;
        --size: 0;
      }
      .segment {
        flex: var(--size) 0 0;
        background-color: color-mix(in srgb, CanvasText 10%, transparent);
        &::before {
          content: '';
          display: block;
          height: 100%;
          width: var(--progress);
          background-color: CanvasText;
        }
      }
      .has-hash {
        display: grid;
        grid-template-areas:
          'progress progress'
          'sidebar preview';
        grid-template-rows: auto 1fr;
        grid-template-columns: 30fr 70fr;
      }
      .progress-wrapper {
        grid-area: progress;
        padding: 10px;
        border-bottom: 1px solid color-mix(in srgb, CanvasText 10%, transparent);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .files {
        grid-area: sidebar;
        border-right: 1px solid color-mix(in srgb, CanvasText 10%, transparent);
      }
      .preview {
        grid-area: preview;
      }
      .files {
        overflow: auto;
      }
      #files-wrapper {
        padding: 10px;
        --depth: 0;
      }
      #files-wrapper,
      .tree {
        display: flex;
        flex-direction: column;
      }
      .file {
        text-align: left;
      }
      .tree {
        /* padding-left: 10px; */
        position: relative;
      }
      .tree:before {
        position: absolute;
        content: '';
        display: block;
        border-left: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
        top: 0;
        left: calc(var(--depth) * 10px - 2.5px);
        bottom: 0;
      }
      .file,
      .dirname {
        display: grid;
        grid-template-columns: 20px 1fr;
        grid-template-areas: 'marker filename';
        border-radius: 5px;
        height: 30px;
        align-content: center;
        padding-left: calc(var(--depth) * 10px);

        &:hover {
          background-color: color-mix(in srgb, CanvasText 3%, transparent);
        }
        & span {
          grid-area: filename;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: pre;
        }
      }
      .file {
        color: color-mix(in srgb, CanvasText 80%, transparent);
      }
      .dirname {
        cursor: pointer;
      }
      .dirname::before {
        content: '›';
        text-align: center;
        display: block;
        grid-area: marker;
        transition: transform 0.2s;
      }
      .dir[open] > .dirname::before {
        transform: rotate(90deg);
      }
      .no-hash .progress-wrapper,
      .no-hash .files,
      .no-hash .preview {
        display: none;
      }
    </style>
  </head>
  <body class="has-hash no-hash">
    <form action="./questionable-host-zip-viewer.html" method="get">
      <h1>View zip file</h1>
      <p>
        Preview the contents of a zip file uploaded with
        <a
          href="https://sheeptester.github.io/hello-world/questionable-host/instructions.html"
          >questionable host</a
        >. For other file types, use
        <a href="https://sheeptester.github.io/hello-world/questionable-host/"
          >this viewer</a
        >.
      </p>
      <label>
        <span>
          <strong>File hash</strong>
          <br />
          Expected format: <code>[hash].</code> or <code>i[hash]</code>.
        </span>
        <input
          name="hash"
          type="text"
          pattern="i[0-9a-f]{32}|[0-9a-f]{32}\."
          required
          autofocus
        />
      </label>
      <button>Load</button>
    </form>
    <div class="progress-wrapper">
      <p><span id="loaded">0 B</span> of <span id="total">0 B</span> loaded</p>
      <div id="progress"></div>
    </div>
    <div class="files">
      <div id="files-wrapper"></div>
    </div>
    <div class="preview">
      <iframe id="preview" sandbox></iframe>
    </div>
    <script type="module">
      import mime from 'https://cdn.jsdelivr.net/npm/mime@4.1.0/dist/src/index.js'
      console.log(mime)

      const hashId = new URL(location).searchParams.get('hash')
      if (!hashId) {
        document.body.classList.remove('has-hash')
        throw 'ball'
      }
      document.body.classList.remove('no-hash')

      const getUrl = hash =>
        `https://assets.scratch.mit.edu/internalapi/asset/${hash}.wav/get/`

      const progress = document.getElementById('progress')
      const loadedCount = document.getElementById('loaded')
      const totalCount = document.getElementById('total')
      const filesWrapper = document.getElementById('files-wrapper')
      const preview = document.getElementById('preview')

      function displayBytes (bytes) {
        if (bytes > 1_000_000_000) {
          return `${(bytes / 1_000_000_000).toFixed(2)} GB`
        } else if (bytes > 1_000_000) {
          return `${(bytes / 1_000_000).toFixed(2)} MB`
        } else if (bytes > 1_000) {
          return `${(bytes / 1_000).toFixed(2)} kB`
        } else if (bytes !== 1) {
          return `${bytes} bytes`
        } else {
          return '1 byte'
        }
      }

      const chunks = []
      let totalLoaded = 0

      class Chunk {
        element = Object.assign(document.createElement('div'), {
          className: 'segment'
        })
        #listeners = []
        offset = -1
        #started = false

        async start () {
          if (this.#started) {
            return
          }
          this.#started = true
          const response = await fetch(getUrl(this.hash))
          if (!response.ok) {
            throw new Error(`HTTP ${response.status} error`)
          }
          this.length = +response.headers.get('content-length')
          this.element.style.setProperty('--size', this.length)
          if (!this.target) {
            this.target = {
              offset: 0,
              bytes: new Uint8Array(this.length)
            }
          }
          this.offset = 0
          for await (const chunk of response.body) {
            this.target.bytes.set(chunk, this.target.offset + this.offset)
            this.offset += chunk.byteLength
            totalLoaded += chunk.byteLength
            this.#listeners = this.#listeners.filter(({ min, listener }) => {
              if (this.offset >= min) {
                listener()
                return false
              }
              return true
            })
            this.element.style.setProperty(
              '--progress',
              `${(this.offset / this.length) * 100}%`
            )
            loadedCount.textContent = displayBytes(totalLoaded)
          }
          this.offset = Infinity
          for (const { listener } of this.#listeners) {
            listener()
          }
        }

        on (min, listener) {
          if (this.offset >= min) {
            listener()
          } else {
            this.#listeners.push({ min, listener })
          }
        }
      }

      // not sure why 15 and not like 9
      const INODE_HEADER_SIZE = 15
      const HASH_SIZE = 16
      const MAX_SIZE = 10 * 1000 * 1000 - 1

      const bigBufferReady = Promise.withResolvers()
      let bigView

      const isInode = hashId.startsWith('i')
      const firstHash = isInode ? hashId.slice(1) : hashId.slice(0, -1)
      const chunk = new Chunk()
      chunk.hash = firstHash
      chunk.fullOffset = 0
      chunks.push(chunk)
      progress.append(chunk.element)
      if (isInode) {
        chunk.on(INODE_HEADER_SIZE, () => {
          const temp = new Uint8Array(12)
          temp.set(chunk.target.bytes.subarray(0, 6), 2)
          temp.set(chunk.target.bytes.subarray(6, 9), 9)
          const view = new DataView(temp.buffer)
          const fileSize = Number(view.getBigUint64(0))
          const chunkCount = view.getUint32(8)

          console.log('file size:', fileSize)
          console.log('number of additional chunks:', chunkCount)

          bigView = new Uint8Array(fileSize)
          bigBufferReady.resolve()
          const headerEnd = INODE_HEADER_SIZE + chunkCount * HASH_SIZE
          const chunkDataByteOffset = chunk.length - headerEnd

          const fragment = document.createDocumentFragment()
          for (let i = 0; i < chunkCount; i++) {
            const c = new Chunk()
            // assumes that all chunks are MAX_SIZE until the end
            c.fullOffset = chunkDataByteOffset + i * MAX_SIZE
            c.fullLength = Math.min(MAX_SIZE, fileSize - c.fullOffset)
            c.element.style.setProperty('--size', c.fullLength)
            c.target = { bytes: bigView, offset: c.fullOffset }
            chunks.push(c)
            fragment.append(c.element)
          }
          progress.append(fragment)

          chunk.on(headerEnd, () => {
            for (let i = 0; i < chunkCount; i++) {
              chunks[i + 1].hash = chunk.target.bytes
                .subarray(
                  INODE_HEADER_SIZE + i * HASH_SIZE,
                  INODE_HEADER_SIZE + (i + 1) * HASH_SIZE
                )
                .values()
                .map(byte => byte.toString(16).padStart(2, '0'))
                .toArray()
                .join('')
            }
            bigView.set(chunk.target.bytes.subarray(headerEnd))
            chunk.target = { bytes: bigView, offset: -headerEnd }
          })
        })
      }
      chunk.start()
      if (!isInode) {
        chunk.on(0, () => {
          chunk.fullLength = chunk.length
          bigView = chunk.target.bytes
          bigBufferReady.resolve()
        })
      }

      await bigBufferReady.promise
      totalCount.textContent = displayBytes(bigView.byteLength)

      class QuestionableReader extends zip.Reader {
        size = bigView.byteLength

        async readUint8Array (offset, length) {
          console.log('[read]', { offset, length })
          await Promise.all(
            chunks.values().map(chunk => {
              if (
                chunk.fullOffset < offset + length &&
                offset < chunk.fullOffset + chunk.fullLength
              ) {
                const resolvers = Promise.withResolvers()
                chunk.on(offset + length - chunk.fullOffset, resolvers.resolve)
                chunk.start()
                return resolvers.promise
              }
            })
          )
          return bigView.subarray(offset, offset + length)
        }
      }

      const collator = new Intl.Collator('en-US', { numeric: true })
      function addEntry (tree, [segment, ...rest], item, depth = 0) {
        if (rest.length > 0) {
          const index = tree.entries.findIndex(entry =>
            entry.dir ? collator.compare(segment, entry.name) <= 0 : true
          )
          if (index !== -1) {
            const treeEntry = tree.entries[index]
            if (treeEntry.dir && treeEntry.name === segment) {
              addEntry(treeEntry, rest, item, depth + 1)
              return
            }
          }
          const details = Object.assign(document.createElement('details'), {
            className: 'dir'
          })
          const summary = Object.assign(document.createElement('summary'), {
            className: 'dirname'
          })
          summary.append(
            Object.assign(document.createElement('span'), {
              textContent: segment
            })
          )
          const treeContents = Object.assign(document.createElement('div'), {
            className: 'tree'
          })
          treeContents.style.setProperty('--depth', depth + 1)
          const newTree = {
            dir: true,
            name: segment,
            contents: treeContents,
            elem: details,
            entries: []
          }
          details.append(summary, treeContents)
          if (index === -1) {
            tree.contents.append(details)
            tree.entries.push(newTree)
          } else {
            tree.entries[index].elem.before(details)
            tree.entries.splice(index, 0, newTree)
          }
          addEntry(newTree, rest, item, depth + 1)
        } else {
          const index = tree.entries.findIndex(
            entry => !entry.dir && collator.compare(segment, entry.name) < 0
          )
          if (index === -1) {
            tree.contents.append(item.elem)
            tree.entries.push({ ...item, name: segment })
          } else {
            tree.entries[index].elem.before(item.elem)
            tree.entries.splice(index, 0, { ...item, name: segment })
          }
        }
      }

      const reader = new zip.ZipReader(new QuestionableReader())
      window.zip = reader
      console.log('ZipReader instance stored in window.zip')

      const root = {
        contents: filesWrapper,
        entries: []
      }
      let blob
      let abort
      for await (const entry of reader.getEntriesGenerator()) {
        if (entry.directory) {
          continue
        }
        const { compressedSize, filename, lastModDate, uncompressedSize } =
          entry
        const segments = filename.split('/')
        const elem = Object.assign(document.createElement('button'), {
          className: 'file',
          title: filename
        })
        elem.append(
          Object.assign(document.createElement('span'), {
            textContent: segments.at(-1)
          })
        )
        addEntry(root, segments, { elem })

        elem.addEventListener('click', async () => {
          if (blob) {
            URL.revokeObjectURL(blob)
            abort.abort()
          }
          abort = new AbortController()
          const buffer = await entry.arrayBuffer({
            signal: abort.signal,
            onprogress: (progress, total) => {}
          })
          const dotIndex = segments.at(-1).indexOf('.')
          preview.src = URL.createObjectURL(
            new Blob([buffer], {
              type:
                allTypes[segments.at(-1)?.split('.').at(-1) ?? ''] ??
                'text/plain'
            })
          )
        })
      }
    </script>
  </body>
</html>
